name: dt032-https-lab
services:
  vulnerable:
    image: python:3.12-alpine
    container_name: dt032-vulnerable
    command: ["python", "-u", "/app/server.py"]
    environment:
      LAB_MODE: vulnerable
      PUBLIC_HTTP_PORT: "5080"
      PUBLIC_HTTPS_PORT: "5443"
    volumes:
      - ./05_Source_code/https_lab:/app:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:5080:5080"
      - "127.0.0.1:5443:5443"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  hardened:
    image: python:3.12-alpine
    container_name: dt032-hardened
    command: ["python", "-u", "/app/server.py"]
    environment:
      LAB_MODE: hardened
      PUBLIC_HTTP_PORT: "5180"
      PUBLIC_HTTPS_PORT: "5543"
    volumes:
      - ./05_Source_code/https_lab:/app:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:5180:5080"
      - "127.0.0.1:5543:5443"
    restart: "no"
    security_opt:
      - no-new-privileges:true
